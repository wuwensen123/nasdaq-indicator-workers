<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定投计算器 - 纳斯达克100 仪表盘</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg-dark: #f5f7fa; --bg-card: #ffffff; --border-color: #d0d7de;
  --text-primary: #1a1a2e; --text-secondary: #586069;
  --green: #2da44e; --yellow: #bf8700; --red: #cf222e; --blue: #0969da;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-dark); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; min-height: 100vh; }
.header { background: linear-gradient(135deg, #f0f2f5 0%, #e6e9ef 50%, #dce0e8 100%); border-bottom: 1px solid var(--border-color); padding: 20px 0; }
.header h1 { font-size: 1.5rem; font-weight: 700; margin: 0; background: linear-gradient(90deg, #0969da, #8250df, #cf222e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 16px; }
.card-header { background: transparent; border-bottom: 1px solid var(--border-color); padding: 12px 16px; font-weight: 600; color: var(--text-primary); }
.card-body { padding: 16px; }
.form-label { color: var(--text-secondary); font-size: 0.9rem; }
.form-control, .form-select { background: #ffffff; border: 1px solid var(--border-color); color: var(--text-primary); }
.form-control:focus, .form-select:focus { background: #ffffff; border-color: var(--blue); color: var(--text-primary); box-shadow: none; }
.form-select option { background: #ffffff; color: #1a1a2e; }

.form-control::placeholder { color: #6c757d; }
.btn-primary { background: linear-gradient(135deg, #238636, #2ea043); border: none; color: white; font-weight: 500; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(45, 164, 78, 0.3); }
.btn-outline-secondary { border-color: var(--border-color); color: var(--text-primary); }
.btn-outline-secondary:hover { background: rgba(0,0,0,0.03); border-color: var(--blue); color: var(--blue); }
.result-card { background: linear-gradient(135deg, #f0f2f5 0%, #e6e9ef 50%, #dce0e8 100%); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; text-align: center; }
.result-card .value { font-size: 1.6rem; font-weight: 700; word-break: break-all; overflow-wrap: break-word; }
.result-card .label { font-size: 0.85rem; color: var(--text-secondary); }
.table { color: var(--text-primary); font-size: 0.9rem; }
.table th { border-color: var(--border-color); color: var(--text-secondary); font-weight: 500; }
.table td { border-color: var(--border-color); }
.table-striped > tbody > tr:nth-of-type(odd) { background: rgba(0,0,0,0.02); }
.asset-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.asset-row .form-control { flex: 1; }
.asset-row .form-select { width: 120px; }
.asset-row .btn-remove { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1.2rem; }
.preset-btn { background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); padding: 8px 16px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
.preset-btn:hover { border-color: var(--blue); color: var(--blue); }
.preset-btn.active { border-color: var(--green); color: var(--green); background: rgba(63, 185, 80, 0.1); }
#loadingSpinner { display: none; }
#loadingSpinner.active { display: inline-block; }
</style>
</head>
<body>

<header class="header">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-6">
        <h1>📈 定投回测计算器</h1>
        <div class="text-secondary" style="font-size:0.9rem;margin-top:4px;">基于历史数据（含分红）的多标的定投回测</div>
      </div>
      <div class="col-md-6 text-md-end">
        <a href="/" class="btn btn-outline-secondary">📊 返回仪表盘</a>
      </div>
    </div>
  </div>
</header>

<main class="container py-4">
  <div class="row">
    <!-- 左侧：参数设置 -->
    <div class="col-lg-4">
      <div class="card">
        <div class="card-header">⚙️ 参数设置</div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">定投频率</label>
            <select class="form-select" id="frequency">
              <option value="monthly">每月</option>
              <option value="weekly">每周</option>
              <option value="quarterly">每季度</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">每次定投金额（元）</label>
            <input type="number" class="form-control" id="amount" value="1000" min="1">
          </div>
          <div class="mb-3">
            <label class="form-label">开始日期</label>
            <input type="date" class="form-control" id="startDate" value="2015-01-01">
          </div>
          <div class="mb-3">
            <label class="form-label">结束日期</label>
            <input type="date" class="form-control" id="endDate" value="2026-08-01">
          </div>
          <div class="mb-3">
            <label class="form-label">预设组合</label>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;">
              <button class="preset-btn" onclick="loadPreset('allweather',this)">🌤 全天候</button>
              <button class="preset-btn" onclick="loadPreset('permanent',this)">🔒 永久组合</button>
              <button class="preset-btn" onclick="loadPreset('buffett',this)">🧑 巴菲特退休</button>
              <button class="preset-btn" onclick="loadPreset('custom',this)">✏️ 自定义</button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">投资标的</label>
            <div id="assetList">
              <div class="asset-row">
                <select class="form-select" style="flex:2">
                  <option value="QQQ">QQQ 纳斯达克100</option>
                  <option value="VOO" selected>VOO 标普500</option>
                  <option value="SPY">SPY 标普500</option>
                  <option value="GLD">GLD 黄金</option>
                  <option value="TLT">TLT 长期国债</option>
                  <option value="IEF">IEF 中期国债</option>
                  <option value="SHY">SHY 短期国债</option>
                  <option value="DBC">DBC 商品</option>
                  <option value="^HSI">^HSI 恒生指数</option>
                  <option value="000300.SS">000300.SS 沪深300</option>
                </select>
                <input type="number" class="form-control" style="width:80px" value="100" min="1" max="100" placeholder="%" oninput="updateWeightTotal()">
                <span style="color:var(--text-secondary);font-size:0.85rem;">%</span>
              </div>
            </div>
            <button class="btn btn-outline-secondary btn-sm mt-2" onclick="addAsset()">+ 添加标的</button>
            <div id="weightTotal" style="margin-top:8px;font-size:0.85rem;color:var(--green);">总比例: 100%</div>
          </div>
          <div class="mb-3">
            <label class="form-label">自定义股票代码</label>
            <div class="d-flex gap-1">
              <input type="text" class="form-control" id="customSymbol" placeholder="如 AAPL、TSLA、600519.SS" value="">
              <button class="btn btn-outline-secondary btn-sm" style="white-space:nowrap;" onclick="checkSymbol()">🔍 检测</button>
            </div>
            <div id="symbolCheckResult" style="font-size:0.85rem;margin-top:4px;"></div>
          </div>
          <button class="btn btn-primary w-100" id="runBacktestBtn" onclick="runBacktest()">
            <span id="loadingSpinner" class="spinner-border spinner-border-sm me-1"></span>
            🚀 开始回测
          </button>
        </div>
      </div>
    </div>

    <!-- 右侧：结果展示 -->
    <div class="col-lg-8">
      <div id="resultArea">
        <div class="card">
          <div class="card-body text-center py-5" style="color:var(--text-secondary);">
            <div style="font-size:3rem;margin-bottom:16px;">📊</div>
            <h5>设置参数后点击"开始回测"</h5>
            <p>支持多标的组合定投，含分红再投资</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const API_BASE = 'https://nasdaq-indicator.morisze.workers.dev';
const PRESETS = {
  allweather: { name: '全天候组合', assets: [
    { symbol: 'VOO', weight: 30 }, { symbol: 'TLT', weight: 40 },
    { symbol: 'IEF', weight: 15 }, { symbol: 'GLD', weight: 7.5 },
    { symbol: 'DBC', weight: 7.5 },
  ]},
  permanent: { name: '永久组合', assets: [
    { symbol: 'VOO', weight: 25 }, { symbol: 'TLT', weight: 25 },
    { symbol: 'GLD', weight: 25 }, { symbol: 'SHY', weight: 25 },
  ]},
  buffett: { name: '巴菲特退休组合', assets: [
    { symbol: 'VOO', weight: 90 }, { symbol: 'SHY', weight: 10 },
  ]},
};

function loadPreset(name, btn) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (name === 'custom') return;
  const preset = PRESETS[name];
  document.getElementById('assetList').innerHTML = '';
  for (const a of preset.assets) {
    addAssetRow(a.symbol, a.weight);
  }
}

function addAsset() { addAssetRow('VOO', 100); }

function updateWeightTotal() {
  const el = document.getElementById('weightTotal');
  if (!el) return;
  let total = 0;
  document.querySelectorAll('.asset-row input[type=number]').forEach(input => {
    total += parseFloat(input.value) || 0;
  });
  const rounded = Math.round(total);
  if (rounded === 100) {
    el.textContent = `总比例: 100%`;
    el.style.color = 'var(--green)';
    el.style.fontWeight = 'normal';
  } else {
    el.textContent = `总比例: ${total.toFixed(1)}% ⚠️ 建议调整为100%（将自动归一化）`;
    el.style.color = 'var(--red)';
    el.style.fontWeight = 'bold';
  }
}

function addAssetRow(symbol, weight) {
  const div = document.createElement('div');
  div.className = 'asset-row';
  div.dataset.symbol = symbol;
  const isCustom = !['QQQ','VOO','SPY','GLD','TLT','IEF','SHY','DBC','^HSI','000300.SS'].includes(symbol);
  div.innerHTML = `
    <input type="text" class="form-control" style="flex:2" value="${symbol}" list="presetSymbols" placeholder="股票代码">
    <datalist id="presetSymbols">
      <option value="QQQ">QQQ 纳斯达克100</option>
      <option value="VOO">VOO 标普500</option>
      <option value="SPY">SPY 标普500</option>
      <option value="GLD">GLD 黄金</option>
      <option value="TLT">TLT 长期国债</option>
      <option value="IEF">IEF 中期国债</option>
      <option value="SHY">SHY 短期国债</option>
      <option value="DBC">DBC 商品</option>
      <option value="^HSI">^HSI 恒生指数</option>
      <option value="000300.SS">沪深300</option>
    </datalist>
    <input type="number" class="form-control" style="width:80px" value="${weight}" min="1" max="100" placeholder="%" oninput="updateWeightTotal()">
    <span style="color:var(--text-secondary);font-size:0.85rem;">%</span>
    <button class="btn-remove" onclick="this.parentElement.remove();updateWeightTotal()">×</button>
  `;
  document.getElementById('assetList').appendChild(div);
  updateWeightTotal();
}

async function checkSymbol() {
  const symbol = document.getElementById('customSymbol').value.trim().toUpperCase();
  const result = document.getElementById('symbolCheckResult');
  if (!symbol) { result.textContent = '请输入股票代码'; result.style.color = 'var(--yellow)'; return; }
  result.textContent = '检测中...';
  result.style.color = 'var(--text-secondary)';
  try {
    const res = await fetch(API_BASE + '/api/check-symbol', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symbol }),
    });
    const data = await res.json();
    if (data.success) {
      result.textContent = `✅ ${symbol} 可用 (${data.name})，已添加到标的`;
      result.style.color = 'var(--green)';
      addAssetRow(symbol, 100);
      document.getElementById('customSymbol').value = '';
    } else {
      result.textContent = `❌ ${symbol} 不可用: ${data.error || '未找到'}`;
      result.style.color = 'var(--red)';
    }
  } catch (e) {
    result.textContent = '❌ 检测失败: ' + e.message;
    result.style.color = 'var(--red)';
  }
}

async function runBacktest() {
  const spinner = document.getElementById('loadingSpinner');
  spinner.classList.add('active');
  const btn = document.getElementById('runBacktestBtn');
  btn.disabled = true;

  const assets = [];
  document.querySelectorAll('.asset-row').forEach(row => {
    const symbolInput = row.querySelector('input[type=text]') || row.querySelector('select');
    const symbol = (symbolInput.value || '').trim().toUpperCase();
    const weight = parseFloat(row.querySelector('input[type=number]').value) || 0;
    if (symbol && weight > 0) assets.push({ symbol, weight });
  });

  // 归一化权重
  const totalWeight = assets.reduce((s, a) => s + a.weight, 0);
  if (totalWeight <= 0) { alert('请设置有效的权重'); spinner.classList.remove('active'); btn.disabled = false; return; }
  assets.forEach(a => a.weight /= totalWeight);

  const body = {
    assets,
    amount: parseFloat(document.getElementById('amount').value) || 1000,
    frequency: document.getElementById('frequency').value,
    startDate: document.getElementById('startDate').value,
    endDate: document.getElementById('endDate').value,
  };

  try {
    const res = await fetch(API_BASE + '/api/backtest', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.success) renderResults(data);
    else alert('错误: ' + (data.error || '未知错误'));
  } catch (e) {
    alert('网络错误: ' + e.message);
  } finally {
    spinner.classList.remove('active');
    btn.disabled = false;
  }
}

function renderResults(data) {
  const area = document.getElementById('resultArea');
  // 概况卡片
  let html = `
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="result-card">
        <div class="label">总投入</div>
        <div class="value" style="color:var(--blue);">¥${fmt(data.totalInvested)}</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="result-card">
        <div class="label">最终金额</div>
        <div class="value" style="color:var(--green);">¥${fmt(data.finalValue)}</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="result-card">
        <div class="label">本金倍数</div>
        <div class="value" style="color:${data.multiple >= 1 ? 'var(--green)' : 'var(--red)'};">${data.multiple}x</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="result-card">
        <div class="label">年化收益率 (CAGR)</div>
        <div class="value" style="color:${data.cagr >= 0 ? 'var(--green)' : 'var(--red)'};">${data.cagr}%</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="result-card">
        <div class="label">XIRR 收益率</div>
        <div class="value" style="color:${data.xirr >= 0 ? 'var(--green)' : 'var(--red)'};">${data.xirr}%</div>
      </div>
    </div>
  </div>`;

  // 逐年表格
  html += `<div class="card"><div class="card-header">📅 逐年收益明细</div><div class="card-body"><div class="table-responsive"><table class="table table-striped"><thead><tr>
    <th>年份</th><th>当年投入</th><th>累计投入</th><th>年末总金额</th><th>年收益率</th>
  </tr></thead><tbody>`;
  const yearly = data.yearly || [];
  for (let idx = 0; idx < yearly.length; idx++) {
    const y = yearly[idx];
    const color = y.return >= 0 ? 'var(--green)' : 'var(--red)';
    const prevInv = idx > 0 ? yearly[idx-1].invested : 0;
    html += `<tr>
      <td>${y.year}</td>
      <td>¥${fmt(y.invested - prevInv)}</td>
      <td>¥${fmt(y.invested)}</td>
      <td>¥${fmt(y.value)}</td>
      <td style="color:${color};">${y.return >= 0 ? '+' : ''}${y.return}%</td>
    </tr>`;
  }html += `</tbody></table></div></div></div>`;

  // 图表
  html += `<div class="card"><div class="card-header">📈 累计金额曲线</div><div class="card-body"><canvas id="valueChart" height="300"></canvas></div></div>`;
  html += `<div class="card"><div class="card-header">📊 逐年收益率</div><div class="card-body"><canvas id="returnChart" height="200"></canvas></div></div>`;

  area.innerHTML = html;

  // 绘制图表
  const years = (data.yearly || []).map(y => y.year);
  const values = (data.yearly || []).map(y => y.value);
  const returns = (data.yearly || []).map(y => y.return);

  setTimeout(() => {
    new Chart(document.getElementById('valueChart'), {
      type: 'line', data: {
        labels: years, datasets: [{
          label: '总金额', data: values, borderColor: '#58a6ff', backgroundColor: 'rgba(88,166,255,0.1)', fill: true, tension: 0.3
        }]
      }, options: { responsive: true, plugins: { legend: { labels: { color: '#1a1a2e' } } },
        scales: { x: { ticks: { color: '#8b949e' } }, y: { ticks: { color: '#8b949e', callback: v => '¥' + (v/10000).toFixed(0) + '万' } } }
      }
    });
    new Chart(document.getElementById('returnChart'), {
      type: 'bar', data: {
        labels: years, datasets: [{
          label: '年收益率 %', data: returns,
          backgroundColor: returns.map(r => r >= 0 ? 'rgba(63,185,80,0.6)' : 'rgba(248,81,73,0.6)'),
          borderColor: returns.map(r => r >= 0 ? '#3fb950' : '#f85149'), borderWidth: 1
        }]
      }, options: { responsive: true, plugins: { legend: { labels: { color: '#1a1a2e' } } },
        scales: { x: { ticks: { color: '#8b949e' } }, y: { ticks: { color: '#8b949e', callback: v => v + '%' } } }
      }
    });
  }, 100);
}

function fmt(n) {
  n = n || 0;
  if (Math.abs(n) >= 100000000) return (n / 100000000).toFixed(2) + '亿';
  if (Math.abs(n) >= 10000) return (n / 10000).toFixed(2) + '万';
  return n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
</script>
</body>
</html>
